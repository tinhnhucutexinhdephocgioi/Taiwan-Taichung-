<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Taichung 2026</title>
<style>
:root{--bg:#f5f4f2;--card:#fff;--ink:#1b1b1b;--mute:#8a8a8a;--line:#e3e1dd;--navy:#16294d;--food:#f6ece8;--foodink:#8a3a22;--badge:#e8effb;--badgeink:#1f3b73}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--ink:#f1f1f1;--mute:#9a9a9a;--line:#333;--navy:#8fb0ff;--food:#2b1f1b;--foodink:#e8a58f;--badge:#22304f;--badgeink:#bcd0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","Noto Sans TC","Noto Sans",sans-serif;line-height:1.45}
header{background:var(--card);padding:28px 20px 18px;border-bottom:1px solid var(--line)}
.wrap{max-width:720px;margin:0 auto}
h1{margin:0;font-size:28px}
.sub{color:var(--mute);margin:6px 0 16px}
.langs{display:flex;gap:8px;flex-wrap:wrap}
.langs button{font:inherit;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer}
.langs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media(prefers-color-scheme:dark){.langs button.on{color:#111}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat small{color:var(--mute);font-size:12px;letter-spacing:.06em}
.stat b{display:block;font-size:22px}
.city{display:flex;align-items:center;gap:12px;margin:26px 0 12px;font-weight:700;letter-spacing:.1em;font-size:14px}
.city::before,.city::after{content:"";flex:1;height:1px;background:var(--line)}
details{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
details.food{background:var(--food);border-color:transparent}
summary{list-style:none;display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"\2304";margin-left:auto;color:var(--mute);font-size:20px;transition:transform .2s}
details[open] summary::after{transform:rotate(180deg)}
.badge{flex:none;width:52px;height:52px;border-radius:50%;background:var(--badge);color:var(--badgeink);display:grid;place-items:center;font-weight:700;font-size:13px}
.food summary{color:var(--foodink)}
.ico{font-size:30px}
li.tip{display:block;line-height:1.5}
.t small{color:var(--mute);display:block}
.food .t small{color:var(--foodink);opacity:.8}
.t strong{font-size:18px}
ul{list-style:none;margin:0;padding:0 16px 14px}
li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
li time{flex:none;width:48px;color:var(--mute);font-size:14px}
li a{margin-left:auto;text-decoration:none;font-size:18px}
.how{margin:0 16px 8px;padding:10px 12px;border-radius:10px;background:var(--badge);color:var(--badgeink);font-size:14px}
li a+a{margin-left:6px}
.tally{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.tally b{font-size:18px}
li.gift label{display:flex;gap:10px;align-items:center;width:100%;cursor:pointer}
li.gift input{width:18px;height:18px;flex:none}
li.gift small{display:block;color:var(--mute);font-size:12px}
li.gift em{margin-left:auto;font-style:normal;color:var(--mute);white-space:nowrap;font-size:14px}
.note{padding:0 16px 14px;color:var(--mute);font-size:14px}
footer{color:var(--mute);font-size:13px;text-align:center;padding:20px}
</style>
</head>
<body>
<header><div class="wrap">
<h1 id="title"></h1><p class="sub" id="sub"></p>
<div class="langs" id="langs"></div>
</div></header>
<main class="wrap">
<div class="stats" id="stats"></div>
<div id="list"></div>
</main>
<footer id="foot"></footer>

  ["Mazu is the sea goddess who protects travelers and fishermen. Lukang's Tianhou Temple is dedicated to her.","媽祖是保佑航海與旅人的海神,鹿港天后宮就是供奉媽祖的廟。","Mazu là nữ thần biển bảo hộ người đi biển và du khách. Chùa Thiên Hậu ở Lộc Cảng thờ bà."],
  ["Dress modestly, don't step on the door threshold, don't touch offerings, and keep your voice down. Hold incense with both hands.","穿著端莊,不要踩門檻、碰供品,保持安靜。上香時雙手持香。","Ăn mặc kín đáo, không dẫm lên ngưỡng cửa, không chạm đồ cúng, nói khẽ. Cầm hương bằng hai tay."],
  ["Moon blocks (擲筊): two red crescent blocks answer yes or no. Ask one clear question; it's a part of the temple tradition, not a toy.","擲筊用兩個紅色月牙形筊杯問是非,一次問一個明確問題,不是玩具。","Cầu quẻ (擲筊): hai miếng gỗ đỏ hình trăng khuyết cho câu trả lời có hoặc không. Hỏi một câu rõ ràng, đây là nghi thức chứ không phải đồ chơi."],
  ["Rainbow Village was painted by a former soldier, 'Rainbow Grandpa', to save the village from demolition.","彩虹眷村是退伍老兵「彩虹爺爺」為了保住村子免於拆除而彩繪的。","Làng Cầu Vồng do một cựu binh, 'ông cụ Cầu Vồng', vẽ để cứu ngôi làng khỏi bị phá bỏ."],
  ["Red means luck and protection, so you will see red lanterns and paper decorations at temples.","紅色代表吉祥與平安,所以廟宇常見紅燈籠與紅色裝飾。","Màu đỏ tượng trưng cho may mắn và bình an, nên đền chùa thường có đèn lồng và đồ trang trí màu đỏ."]]},
 {i:"🍜",t:{en:"First-timer food list",zh:"首次來台必吃清單",vi:"Món nên thử lần đầu"},items:[
  ["Bubble tea: Taichung is where it is said to have started. Order sweetness as 全糖 full, 半糖 half, 微糖 light or 無糖 none.","珍珠奶茶:相傳發源於台中。甜度可選全糖、半糖、微糖、無糖。","Trà sữa trân châu: tương truyền bắt nguồn từ Đài Trung. Chọn độ ngọt: 全糖 đủ ngọt, 半糖 nửa đường, 微糖 ít đường, 無糖 không đường."],
  ["Braised pork rice (滷肉飯) and beef noodle soup (牛肉麵) are everyday classics.","滷肉飯與牛肉麵是台灣日常經典。","Cơm thịt kho (滷肉飯) và mì bò (牛肉麵) là món quen thuộc hằng ngày."],
  ["Stinky tofu (臭豆腐): strong smell, mild taste. Try it once at a night market.","臭豆腐:味道重但口感溫和,夜市值得嘗一次。","Đậu hũ thối (臭豆腐): mùi nồng nhưng vị nhẹ. Thử một lần ở chợ đêm."],
  ["Big fried chicken cutlet (雞排) is a Fengjia Night Market classic.","大雞排是逢甲夜市的經典小吃。","Gà chiên cỡ lớn (雞排) là món kinh điển ở chợ đêm Phùng Giáp."],
  ["Convenience stores sell hot tea eggs, cheap drinks and snacks. Handy for lunch on the road.","便利商店有熱茶葉蛋、平價飲料與點心,趕路時很方便。","Cửa hàng tiện lợi bán trứng trà nóng, đồ uống và đồ ăn nhẹ giá rẻ, rất tiện khi đi đường."]]},
 {i:"💳",t:{en:"Money, phone & power",zh:"金錢、網路與電源",vi:"Tiền, mạng & ổ điện"},items:[
  ["Bring cash (NT$) for night markets and small shops. Many 7-Eleven and FamilyMart ATMs take foreign cards.","夜市與小店多用現金。許多 7-Eleven、全家的 ATM 可用國外卡。","Mang tiền mặt (TWD) cho chợ đêm và quán nhỏ. Nhiều máy ATM ở 7-Eleven và FamilyMart nhận thẻ nước ngoài."],
  ["Plugs are the two flat-pin type at 110V. Phone chargers are fine, but check hair dryers and other 220V devices.","插座為兩孔扁插頭、110V。手機充電器通常沒問題,吹風機等 220V 電器要先確認。","Ổ cắm hai chân dẹt, điện 110V. Sạc điện thoại dùng được, còn máy sấy tóc hoặc đồ 220V phải kiểm tra trước."],
  ["Get a SIM or eSIM at the airport. Free WiFi is available through iTaiwan in many public places.","可在機場購買SIM卡或eSIM,許多公共場所也有 iTaiwan 免費WiFi。","Mua SIM hoặc eSIM ở sân bay. Nhiều nơi công cộng có WiFi miễn phí iTaiwan."],
  ["Tourists may claim a tax refund when spending NT$2,000 or more at one participating shop on the same day. Ask the shop and keep your passport.","同一天在同一家退稅店消費滿新台幣2,000元可辦理退稅,請詢問店家並攜帶護照。","Du khách có thể hoàn thuế khi mua từ 2.000 TWD trở lên trong một ngày tại một cửa hàng có tham gia. Hỏi cửa hàng và mang hộ chiếu."]]}
];

// ===== Hết dữ liệu =====
var HOME="National Chung Hsing University";
var CHK={};
var lang="vi";
try{lang=localStorage.getItem("lang")||(navigator.language.indexOf("zh")==0?"zh":navigator.language.indexOf("en")==0?"en":"vi")}catch(e){}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function pick(a){return a[lang=="en"?0:lang=="zh"?1:2]}
function updateTally(){var lo=0,hi=0;document.querySelectorAll("#list input[data-k]").forEach(function(c){if(c.checked){lo+=+c.getAttribute("data-lo");hi+=+c.getAttribute("data-hi")}});var t=document.getElementById("tally");if(t)t.textContent="NT$"+lo+(hi>lo?"–"+hi:"")}
function render(){
 var open={};document.querySelectorAll("details[open]").forEach(function(d){open[d.id]=1});
 document.documentElement.lang=lang=="zh"?"zh-Hant":lang;
 document.getElementById("title").textContent=UI.title[lang];
 document.getElementById("sub").textContent=UI.sub[lang];
 document.getElementById("foot").textContent=UI.foot[lang];
 document.getElementById("langs").innerHTML=LANGS.map(function(l){return '<button data-l="'+l[0]+'" class="'+(l[0]==lang?"on":"")+'">'+l[1]+"</button>"}).join("");
 var spots=0,cities={};DAYS.forEach(function(d){spots+=d.stops.length;cities[d.city]=1});
 document.getElementById("stats").innerHTML=[[UI.cities,Object.keys(cities).length],[UI.nights,DAYS.length-1],[UI.spots,spots]].map(function(s){return '<div class="stat"><small>'+s[0][lang].toUpperCase()+"</small><b>"+s[1]+"</b></div>"}).join("");
 var h="",last="",seen={};
 DAYS.forEach(function(d,i){
  if(d.city!=last){
   h+='<div class="city" style="color:'+CITY[d.city].c+'">'+esc(CITY[d.city].n[lang])+"</div>";
   if(!seen[d.city]){seen[d.city]=1;var id="f-"+d.city;
    h+='<details class="food" id="'+id+'"'+(open[id]?" open":"")+'><summary><span class="ico">🍜</span><span class="t"><strong>'+UI.food[lang]+"</strong><small>"+UI.foodSub[lang]+"</small></span></summary><ul>"+FOOD[d.city].map(function(f){return "<li>"+esc(pick(f))+"</li>"}).join("")+"</ul></details>";
    var sid="s-"+d.city;h+='<details class="food" id="'+sid+'"'+(open[sid]?" open":"")+'><summary><span class="ico">🎁</span><span class="t"><strong>'+UI.souv[lang]+"</strong><small>"+UI.souvSub[lang]+"</small></span></summary><ul>"+SOUV[d.city].map(function(f){return "<li>"+esc(pick(f))+"</li>"}).join("")+"</ul></details>";}
   last=d.city;}
  var id="d-"+i;
  h+='<details id="'+id+'"'+(open[id]?" open":"")+'><summary><span class="badge">'+UI.day[lang]+(i+1)+UI.dayEnd[lang]+'</span><span class="t"><strong>'+esc(d.t[lang])+"</strong><small>"+esc(CITY[d.city].n[lang])+"</small></span></summary>"+(d.how?'<div class="how">🚌 '+esc(d.how[lang])+"</div>":"")+"<ul>"+
   d.stops.map(function(s,j){var from=j?d.stops[j-1][4]:HOME;return "<li><time>"+s[0]+"</time><span>"+esc(pick([s[1],s[2],s[3]]))+'</span><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&travelmode=transit&origin='+encodeURIComponent(from)+'&destination='+encodeURIComponent(s[4])+'" aria-label="Transit">🚌</a><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s[4])+'" aria-label="Map">📍</a></li>'}).join("")+
   "</ul>"+(d.note?'<div class="note">'+esc(d.note[lang])+"</div>":"")+"</details>";
 });
 h+='<div class="city" style="color:#c0762b">'+UI.shopTitle[lang]+'</div><div class="tally"><span>'+UI.tally[lang]+'</span><b id="tally">NT$0</b></div>';
 h+='<details id="g-b"'+(open["g-b"]?" open":"")+'><summary><span class="ico">'+BUDGET.i+'</span><span class="t"><strong>'+esc(BUDGET.t[lang])+"</strong></span></summary><ul>"+BUDGET.items.map(function(f){return '<li class="tip">'+esc(pick(f))+"</li>"}).join("")+"</ul></details>";
 GIFTS.forEach(function(g,k){var id="g-"+k;h+='<details id="'+id+'"'+(open[id]?" open":"")+'><summary><span class="ico">'+g.i+'</span><span class="t"><strong>'+esc(g.t[lang])+"</strong></span></summary><ul>"+g.items.map(function(it,j){var key=k+"-"+j;return '<li class="gift"><label><input type="checkbox" data-k="'+key+'" data-lo="'+it.p[0]+'" data-hi="'+it.p[1]+'"'+(CHK[key]?" checked":"")+'><span>'+esc(pick(it.n))+(it.m?"<small>"+esc(pick(it.m))+"</small>":"")+"</span><em>NT$"+it.p[0]+(it.p[1]>it.p[0]?"–"+it.p[1]:"")+"</em></label></li>"}).join("")+"</ul></details>"});
 h+='<div class="city" style="color:#888">'+UI.tipsTitle[lang]+"</div>";
 TIPS.forEach(function(g,k){var id="t-"+k;h+='<details id="'+id+'"'+(open[id]?" open":"")+'><summary><span class="ico">'+g.i+'</span><span class="t"><strong>'+esc(g.t[lang])+"</strong></span></summary><ul>"+g.items.map(function(f){return '<li class="tip">'+esc(pick(f))+"</li>"}).join("")+"</ul></details>"});
 document.getElementById("list").innerHTML=h;
 updateTally();
}
document.getElementById("langs").addEventListener("click",function(e){var l=e.target.getAttribute("data-l");if(l){lang=l;try{localStorage.setItem("lang",l)}catch(x){}render()}});
document.getElementById("list").addEventListener("change",function(e){var k=e.target.getAttribute("data-k");if(k){CHK[k]=e.target.checked;updateTally()}});
render();
</script>
</body>
</html>
